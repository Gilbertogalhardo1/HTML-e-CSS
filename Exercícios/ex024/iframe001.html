<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo de iframe</title>
</head>
<body>
  <h1>Testando o uso de um iframe</h1>
  <p>
    Acessando o
    
    <iframe src="https://www.anhanguera.com" frameborder="0" height="500">
      <a href="https://www.anhanguera.com" target="_blank">site</a>
    </iframe>
    
    para aprender a programar
  </p>
  <p>
    O repositorio do site
   
    <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500" scolling="auto">
      <a href="https://gustavoguanabara.github.io" target="_blank">site</a>
    </iframe>
    
    tambem é legal
  </p>
  
</body>
</html>
